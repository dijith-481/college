<!doctype html>
<html>
  <head>
    <title>form validation</title>
  </head>
  <body>
    <form name="myForm" onsubmit="return validate()">
      name:<input type="text" id="name" /><br />
      age:<input type="number" id="age" /> <br />email:<input
        type="email"
        id="email"
      />
      <input type="submit" value="submit" />
    </form>
    <script>
      function validate() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("name").value;
        let age = document.getElementById("name").value;

        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        console.log(name);
        if (!name || name.len < 5) {
          alert("name should stleast be 5 character long");
          return false;
        }
        if (isNaN(age) || age < 1 || age > 100) {
          alert("age should be between 1 and 100");
          return false;
        }
        if (!emailPattern.test(email)) {
          alert("invalid email");
          return false;
        }
        alert("sucessfully submitted form");
        return true;
      }
    </script>
  </body>
</html>
