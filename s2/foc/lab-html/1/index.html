<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Welcome to My Profile</h1>
    </header>

    <section>
      <img
        id="profile-image"
        src="petergriffin.jpg"
        alt="Profile Picture"
        width="250"
        height="150"
      />
      <p id="introduction">
        Hello! This is a brief introduction about me. I enjoy learning new
        things and connecting with others.
      </p>

      <h2>My Skills</h2>
      <ul>
        <li>Web Development</li>
        <li>ricing linux</li>
        <li>making</li>
      </ul>

      <button id="changeTextBtn">Click Me to Change Text</button>
      <p id="dynamicText">This is the initial text.</p>

      <button id="highlightBtn">Toggle Highlight</button>
      <p id="highlightParagraph">This paragraph can be highlighted.</p>
    </section>

    <footer id="footer">
      <p>&copy; 2025 My Profile</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
