[workspace]
members = ["crates/random", "crates/simulation", "crates/experiments", "crates/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
