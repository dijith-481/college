<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="Horizon sensitivity of timing savings"><style>text{font-family:Inter,Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="510" rx="0" fill="#ffffff" stroke="none"/><text x="55" y="43" fill="#203540" font-size="25" font-weight="700" text-anchor="start">The timing advantage depends on the operating period</text><text x="55" y="72" fill="#536a78" font-size="15" font-weight="400" text-anchor="start">Input minus demand-proportional waiting; positive values favor 28/16/24/12 s</text><line x1="110" y1="410.0" x2="920" y2="410.0" stroke="#dce6eb" stroke-width="1"/><text x="85" y="415.0" fill="#536a78" font-size="14" font-weight="400" text-anchor="end">-50</text><line x1="110" y1="335.0" x2="920" y2="335.0" stroke="#9eb4bd" stroke-width="2"/><text x="85" y="340.0" fill="#536a78" font-size="14" font-weight="400" text-anchor="end">0</text><line x1="110" y1="260.0" x2="920" y2="260.0" stroke="#dce6eb" stroke-width="1"/><text x="85" y="265.0" fill="#536a78" font-size="14" font-weight="400" text-anchor="end">50</text><line x1="110" y1="185.0" x2="920" y2="185.0" stroke="#dce6eb" stroke-width="1"/><text x="85" y="190.0" fill="#536a78" font-size="14" font-weight="400" text-anchor="end">100</text><line x1="110" y1="110.0" x2="920" y2="110.0" stroke="#dce6eb" stroke-width="1"/><text x="85" y="115.0" fill="#536a78" font-size="14" font-weight="400" text-anchor="end">150</text><line x1="110.0" y1="202.30394818439058" x2="110.0" y2="151.20040823948545" stroke="#087f72" stroke-width="5"/><circle cx="110.0" cy="176.75217821193803" r="9" fill="#087f72"/><text x="110.0" y="445" fill="#203540" font-size="15" font-weight="650" text-anchor="middle">10 min</text><text x="110.0" y="159.75217821193803" fill="#087f72" font-size="16" font-weight="700" text-anchor="middle">105</text><line x1="330.9090909090909" y1="281.3066888312908" x2="330.9090909090909" y2="196.63671861034885" stroke="#087f72" stroke-width="5"/><circle cx="330.9090909090909" cy="238.97170372081982" r="9" fill="#087f72"/><text x="330.9090909090909" y="445" fill="#203540" font-size="15" font-weight="650" text-anchor="middle">16 min</text><text x="330.9090909090909" y="221.97170372081982" fill="#087f72" font-size="16" font-weight="700" text-anchor="middle">64</text><line x1="920.0" y1="395.4486536221791" x2="920.0" y2="229.69849556101738" stroke="#087f72" stroke-width="5"/><circle cx="920.0" cy="312.57357459159823" r="9" fill="#087f72"/><text x="920.0" y="445" fill="#203540" font-size="15" font-weight="650" text-anchor="middle">32 min</text><text x="920.0" y="295.57357459159823" fill="#087f72" font-size="16" font-weight="700" text-anchor="middle">15</text><text x="55" y="485" fill="#536a78" font-size="13" font-weight="400" text-anchor="start">5,000 matched fresh runs per horizon, seed 2027; the 32-minute interval crosses zero.</text></svg>